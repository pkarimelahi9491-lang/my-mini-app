    <script>
      // Ensure window.fetch has a setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(fn) { _fetch = fn; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback if property is strictly sealed
      }
    </script>
